name: Deploy Docs Site
permissions:
  contents: read
on:
  push:
    branches: ['bench*']

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      PR_MODE: ${{ contains(github.event.head_commit.message, '[pr]') }}
      NO_MINIFY: ${{ contains(github.event.head_commit.message, '[nominify]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            website/yarn.lock
      - name: Simulate public-PR hardened mode
        if: env.PR_MODE == 'true'
        run: echo "YARN_ENABLE_HARDENED_MODE=1" >> "$GITHUB_ENV"
      - name: yarn install (root)
        run: yarn install --immutable
      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.5.1
        with:
          cache-prefix: turbo-cache-
      - name: Build docs (website deps install in parallel)
        run: |
          (cd website && yarn install --immutable) > website-install.log 2>&1 &
          install_pid=$!
          yarn build:type
          yarn turbo build:doc --single-package
          echo "::group::website yarn install" && wait $install_pid; status=$?; cat website-install.log; echo "::endgroup::"; exit $status
      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.5.1
        with:
          cache-prefix: turbo-cache-website-
          server-port: 41231
      - name: Restore bundler cache
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-docusaurus-bundler-${{ github.sha }}
          path: ./website/node_modules/.cache
          restore-keys: |
            ${{ runner.os }}-docusaurus-bundler-
      - name: Build website
        run: yarn turbo build --env-mode=loose -- ${{ env.NO_MINIFY == 'true' && '--no-minify' || '' }}
        working-directory: ./website
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'
          SKIP_SEARCH_INDEX: ${{ env.PR_MODE }}
      - name: Upload artifact
        if: env.PR_MODE != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/build
